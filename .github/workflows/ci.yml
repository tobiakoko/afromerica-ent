name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel an in-progress run when a newer commit lands on the same branch/PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Non-blocking until the existing lint errors (mostly no-explicit-any) are cleared;
      # remove continue-on-error then so lint gates merges.
      - name: Run linter (non-blocking)
        run: npm run lint
        continue-on-error: true

      - name: Run type check
        run: npx tsc --noEmit

      # There is no test suite yet. Add a "test" script (e.g. Vitest) and a step here
      # running `npm test` once one exists.

      # The build needs no real secrets: clients that use them are created on first request.
      # The Supabase values are placeholders; pages that fetch at build time handle the failure.
      - name: Build application
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
