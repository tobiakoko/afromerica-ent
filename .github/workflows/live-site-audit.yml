name: Live site visual + Lighthouse audit
on:
  workflow_dispatch:
  push:
    branches:
      - 'audit/visual-performance-2026-11-07'

permissions:
  contents: read
concurrency:
  group: visual-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-audit:
    name: Browser screenshots, portfolio composition, Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AUDIT_SITE_URL: 'https://www.afromericaent.com/'
      AUDIT_BRAND: 'Afromerica Entertainment'
      AUDIT_ROUTES_JSON: '[["home","/"],["events","/events"],["artists","/artists"],["about","/about"],["contact","/contact"]]'
      AUDIT_CAPTURE_SECTIONS: 'false'
      AUDIT_ACCENT: '#E95979'
      AUDIT_BACKGROUND: '#180F2D'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser and Lighthouse dependencies
        run: |
          echo "AUDIT_TOOLS=$RUNNER_TEMP/visual-audit-tools" >> "$GITHUB_ENV"
          npm install --prefix "$RUNNER_TEMP/visual-audit-tools" --no-save --no-audit --no-fund playwright@1.56.1 sharp@0.34.5 lighthouse@12
          "$RUNNER_TEMP/visual-audit-tools/node_modules/.bin/playwright" install --with-deps chromium
      - name: Capture authentic desktop and mobile page screenshots
        continue-on-error: true
        run: node scripts/audit/production-visual.mjs
      - name: Run Lighthouse desktop and mobile lab tests
        continue-on-error: true
        run: node scripts/audit/lighthouse-runner.mjs
      - name: Summarize audit results
        if: always()
        run: |
          {
            echo "# Production visual and performance audit"
            echo ""
            echo "Site: \`$AUDIT_SITE_URL\`"
            echo ""
            echo "Capture metadata: \`artifacts/site-captures/capture-metadata.json\`"
            echo "Lighthouse summary: \`artifacts/lighthouse/summary.json\`"
            echo ""
            echo "Note: Lighthouse values are single-run lab results, not field Core Web Vitals."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload captures and performance reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-visual-performance-audit
          path: artifacts/
          retention-days: 30
          if-no-files-found: warn
